{% extends "tasks/base.html" %}
{% block title %}{% if object %}Edit task{% else %}New task{% endif %}{% endblock %}
{% block content %}
  <h1>{% if object %}Edit task{% else %}New task{% endif %}</h1>
  <form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
      <button type="submit" class="btn">Save</button>
      <a class="btn secondary" href="{% url 'tasks:list' %}">Cancel</a>
    </div>
  </form>
{% endblock %}
