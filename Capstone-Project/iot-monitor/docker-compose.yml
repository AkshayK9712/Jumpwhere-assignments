# Production-style stack: PostgreSQL + API (+ the web app served by the API).
#   docker compose -f docker-compose.yml up -d --build
# For development, plain `docker compose up --build` also loads docker-compose.override.yml
# (hot reload, MailHog, demo data simulator).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot}
      POSTGRES_DB: ${POSTGRES_DB:-iotdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-iot} -d $${POSTGRES_DB:-iotdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"   # only this machine; put a TLS reverse proxy in front (see docs/deployment.md)
    volumes:
      - reports:/app/reports_output
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  reports:
