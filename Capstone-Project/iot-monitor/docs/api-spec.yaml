        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Role not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource was modified by someone else
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorBody'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    ValidationErrorBody:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  type: string
              msg:
                type: string
              type:
                type: string
    Message:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    Health:
      type: object
      properties:
        status:
          type: string
          example: ok
        database:
          type: string
          example: connected
      required:
      - status
    EmailOnly:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    UserRole:
      type: string
      enum:
      - admin
      - user
      - guest
    SensorStatus:
      type: string
      enum:
      - active
      - inactive
      - faulty
    SensorCategory:
      type: string
      enum:
      - temperature
      - pressure
      - humidity
      - vibration
      - flow
      - other
    Priority:
      type: string
      enum:
      - low
      - medium
      - high
      - critical
    UserRegister:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
        name:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - email
      - password
      - name
    LoginForm:
      type: object
      properties:
        username:
          type: string
          format: email
        password:
          type: string
          format: password
        remember_me:
          type: boolean
          default: false
      required:
      - username
      - password
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          example: 900
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
    UserOut:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        is_active:
          type: boolean
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_login:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - email
      - name
      - role
      - is_active
      - email_verified
      - created_at
    UserUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
    AdminUserUpdate:
      type: object
      properties:
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        is_active:
          type: boolean
    UserPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserOut'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        pages:
          type: integer
      required:
      - items
      - total
      - page
      - page_size
      - pages
    UserProfileUpdate:
      type: object
      properties:
        avatar_url:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
          maxLength: 500
        phone:
          type: string
          nullable: true
        preferences:
          type: object
          additionalProperties: true
        timezone:
          type: string
          default: UTC
        language:
          type: string
          default: en
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        avatar_url:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
          maxLength: 500
        phone:
          type: string
          nullable: true
        preferences:
          type: object
          additionalProperties: true
        timezone:
          type: string
          default: UTC
        language:
          type: string
          default: en
      required:
      - id
      - user_id
    SensorCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/SensorStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        category:
          $ref: '#/components/schemas/SensorCategory'
        metadata:
          type: object
          properties:
            factory:
              type: string
            location:
              type: string
            unit:
              type: string
              example: °C
            thresholds:
              type: object
              properties:
                min:
                  type: number
                max:
                  type: number
          additionalProperties: true
      required:
      - title
      - category
    SensorUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/SensorStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        category:
          $ref: '#/components/schemas/SensorCategory'
        metadata:
          type: object
          properties:
            factory:
              type: string
            location:
              type: string
            unit:
              type: string
              example: °C
            thresholds:
              type: object
              properties:
                min:
                  type: number
                max:
                  type: number
          additionalProperties: true
    Sensor:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/SensorStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        category:
          $ref: '#/components/schemas/SensorCategory'
        metadata:
          type: object
          properties:
            factory:
              type: string
            location:
              type: string
            unit:
              type: string
              example: °C
            thresholds:
              type: object
              properties:
                min:
                  type: number
                max:
                  type: number
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - title
      - status
      - priority
      - category
      - metadata
      - created_at
      - updated_at
    SensorPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Sensor'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        pages:
          type: integer
      required:
      - items
      - total
      - page
      - page_size
      - pages
    BulkSensorCreate:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SensorCreate'
      required:
      - items
    BulkIds:
      type: object
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer
      required:
      - ids
    BulkResult:
      type: object
      properties:
        processed:
          type: integer
        failed:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              detail:
                type: string
      required:
      - processed
      - failed
    ReadingCreate:
      type: object
      properties:
        value:
          type: number
        recorded_at:
          type: string
          format: date-time
          description: Defaults to server time
      required:
      - value
    ReadingBulkCreate:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ReadingCreate'
      required:
      - items
    Reading:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sensor_id:
          type: integer
        value:
          type: number
        recorded_at:
          type: string
          format: date-time
      required:
      - id
      - sensor_id
      - value
      - recorded_at
    DashboardSummary:
      type: object
      properties:
        total_sensors:
          type: integer
        active_sensors:
          type: integer
        inactive_sensors:
          type: integer
        faulty_sensors:
          type: integer
        readings_last_24h:
          type: integer
        sensors_by_category:
          type: object
          additionalProperties:
            type: integer
        generated_at:
          type: string
          format: date-time
      required:
      - total_sensors
      - active_sensors
      - inactive_sensors
      - faulty_sensors
      - readings_last_24h
      - generated_at
    TimeSeries:
      type: object
      properties:
        sensor_id:
          type: integer
        interval:
          type: string
        points:
          type: array
          items:
            type: object
            properties:
              bucket:
                type: string
                format: date-time
              avg:
                type: number
              min:
                type: number
              max:
                type: number
              count:
                type: integer
      required:
      - sensor_id
      - interval
      - points
    ReportCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        format:
          type: string
          enum:
          - pdf
          - csv
        query_params:
          type: object
          properties:
            sensor_ids:
              type: array
              items:
                type: integer
            category:
              $ref: '#/components/schemas/SensorCategory'
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
            template:
              type: string
              enum:
              - summary
              - detailed
              - alerts
              default: summary
          additionalProperties: true
        scheduled:
          type: boolean
          default: false
        schedule:
          type: object
          properties:
            frequency:
              type: string
              enum:
              - daily
              - weekly
              - monthly
            email:
              type: boolean
              default: true
          description: Required when scheduled is true
      required:
      - name
      - format
    Report:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        format:
          type: string
          enum:
          - pdf
          - csv
        status:
          type: string
          enum:
          - pending
          - ready
          - failed
        query_params:
          type: object
          additionalProperties: true
        scheduled:
          type: boolean
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - user_id
      - name
      - format
      - status
      - scheduled
      - created_at
    ActivityLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          nullable: true
        action:
          type: string
          example: sensor.create
        entity_type:
          type: string
          nullable: true
        entity_id:
          type: integer
          nullable: true
        details:
          type: object
          additionalProperties: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - action
      - created_at
    ActivityLogPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityLog'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        pages:
          type: integer
      required:
      - items
      - total
      - page
      - page_size
      - pages
    SystemConfigUpdate:
      type: object
      properties:
        value: {}
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
          default: true
      required:
      - value
    SystemConfig:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
        value: {}
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
        updated_by:
          type: integer
          nullable: true
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - key
      - value
      - is_active
      - updated_at
