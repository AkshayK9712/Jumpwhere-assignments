openapi: 3.0.3
info:
  title: IoT Monitor API
  version: 1.0.0
  description: 'Centralized API to monitor, control and analyze data from IoT sensors across factory locations.


    **Authentication:** call `POST /auth/login`, then send `Authorization: Bearer <access_token>`.


    **Rate limiting:** every response may include `X-RateLimit-Limit`, `X-RateLimit-Remaining`; exceeding the limit returns
    429 with `Retry-After`.


    **Errors:** `{"detail": "message"}`; validation errors (422) use the FastAPI format.


    **Versioning:** the major version is in the URL path (`/api/v1`). Breaking changes go to `/api/v2`; v1 stays available
    during a deprecation window.'
servers:
- url: http://localhost:8000/api/v1
  description: Local development
tags:
- name: health
- name: auth
- name: users
- name: sensors
- name: readings
- name: dashboard
- name: reports
- name: admin
paths:
  /health:
    get:
      tags:
      - health
      summary: Liveness check
      operationId: health
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /health/db:
    get:
      tags:
      - health
      summary: Database connectivity check
      operationId: health_db
      responses:
        '200':
          description: DB reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database unavailable
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/register:
    post:
      tags:
      - auth
      summary: Register a new account
      operationId: register
      description: Creates an inactive account with role `user` and sends an email verification link. Password must be at
        least 8 characters with upper, lower, digit and symbol.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        '201':
          description: Account created; verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/verify-email:
    get:
      tags:
      - auth
      summary: Verify email address
      operationId: verify_email
      parameters:
      - name: token
        in: query
        required: true
        description: Signed verification token
        schema:
          type: string
      responses:
        '200':
          description: Account activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/resend-verification:
    post:
      tags:
      - auth
      summary: Resend verification email
      operationId: resend_verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnly'
      responses:
        '200':
          description: Email sent if the account exists and is unverified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      tags:
      - auth
      summary: Log in and get tokens
      operationId: login
      description: OAuth2 password flow. `username` is the email. With `remember_me=true` the refresh token lasts 30 days
        instead of 7.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginForm'
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Email not verified or account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Exchange refresh token for a new token pair
      operationId: refresh_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair (old refresh token is rotated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags:
      - auth
      summary: Log out (revoke refresh token)
      operationId: logout
      description: 'Allowed roles: admin, user, guest.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Session closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/me:
    get:
      tags:
      - users
      summary: Get my account
      operationId: get_me
      description: 'Allowed roles: admin, user, guest.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
      - users
      summary: Update my account
      operationId: update_me
      description: 'Allowed roles: admin, user.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/me/profile:
    get:
      tags:
      - users
      summary: Get my profile
      operationId: get_my_profile
      description: 'Allowed roles: admin, user, guest.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
      - users
      summary: Create or replace my profile
      operationId: put_my_profile
      description: 'Allowed roles: admin, user.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users:
    get:
      tags:
      - users
      summary: List users
      operationId: list_users
      description: 'Allowed roles: admin.'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: role
        in: query
        required: false
        description: ''
        schema:
          $ref: '#/components/schemas/UserRole'
      - name: is_active
        in: query
        required: false
        description: ''
        schema:
          type: boolean
      - name: q
        in: query
        required: false
        description: Search name or email
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/{user_id}:
    get:
      tags:
      - users
      summary: Get a user
      operationId: get_user
      description: 'Allowed roles: admin.'
      parameters:
      - name: user_id
        in: path
        required: true
        description: ''
        schema:
          type: integer
      security:
      - bearerAuth: []
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
      - users
      summary: Update role / active state
      operationId: admin_update_user
      description: 'Allowed roles: admin.'
      parameters:
      - name: user_id
        in: path
        required: true
        description: ''
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdate'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
      - users
      summary: Delete a user
      operationId: delete_user
      description: 'Allowed roles: admin.'
      parameters:
      - name: user_id
        in: path
        required: true
        description: ''
        schema:
          type: integer
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sensors:
    get:
      tags:
      - sensors
      summary: List sensors
      operationId: list_sensors
      description: 'Users see their own sensors; admins and guests see all. Allowed roles: admin, user, guest.'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: status
        in: query
        required: false
        description: ''
        schema:
          $ref: '#/components/schemas/SensorStatus'
      - name: category
        in: query
        required: false
        description: ''
        schema:
          $ref: '#/components/schemas/SensorCategory'
      - name: priority
        in: query
        required: false
        description: ''
        schema:
          $ref: '#/components/schemas/Priority'
      - name: q
        in: query
        required: false
        description: Search title/description
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: ''
        schema:
          type: string
          enum:
          - title
          - -title
          - created_at
          - -created_at
          - priority
          - -priority
          default: -created_at
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Page of sensors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
      - sensors
      summary: Create a sensor
      operationId: create_sensor
      description: 'Allowed roles: admin, user.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorCreate'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sensors/bulk:
    post:
      tags:
      - sensors
      summary: Bulk create sensors
      operationId: bulk_create_sensors
      description: 'Allowed roles: admin, user.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkSensorCreate'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
      - sensors
      summary: Bulk delete sensors
      operationId: bulk_delete_sensors
      description: 'Allowed roles: admin, user.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkIds'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sensors/{sensor_id}:
    get:
      tags:
      - sensors
      summary: Get a sensor
      operationId: get_sensor
      description: 'Allowed roles: admin, user, guest.'
      parameters:
      - name: sensor_id
        in: path
        required: true
        description: Sensor ID
        schema:
          type: integer
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Sensor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
      - sensors
      summary: Replace a sensor
      operationId: replace_sensor
      description: 'Allowed roles: admin, user.'
      parameters:
      - name: sensor_id
        in: path
        required: true
        description: Sensor ID
        schema:
          type: integer
      - name: If-Unmodified-Since
        in: header
        required: false
        schema:
          type: string
          format: date-time
        description: 'Optimistic concurrency: reject with 409 if the sensor changed after this time.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorCreate'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
      - sensors
      summary: Partially update a sensor
      operationId: update_sensor
      description: 'Allowed roles: admin, user.'
      parameters:
      - name: sensor_id
        in: path
        required: true
        description: Sensor ID
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorUpdate'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
      - sensors
      summary: Delete a sensor
      operationId: delete_sensor
      description: 'Allowed roles: admin, user.'
      parameters:
      - name: sensor_id
        in: path
        required: true
        description: Sensor ID
        schema:
          type: integer
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Deleted (with its readings)
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sensors/{sensor_id}/readings:
    get:
      tags:
      - readings
      summary: List readings of a sensor
      operationId: list_readings
      description: 'Allowed roles: admin, user, guest.'
      parameters:
      - name: sensor_id
        in: path
        required: true
        description: Sensor ID
        schema:
          type: integer
      - name: from
        in: query
        required: false
        description: ''
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: ''
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
          maximum: 5000
          default: 500
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Readings, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reading'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
      - readings
      summary: Add a reading
      operationId: create_reading
      description: 'Allowed roles: admin, user.'
      parameters:
      - name: sensor_id
        in: path
        required: true
        description: Sensor ID
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingCreate'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reading'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sensors/{sensor_id}/readings/bulk:
    post:
      tags:
      - readings
      summary: Ingest many readings
      operationId: bulk_create_readings
      description: 'Allowed roles: admin, user.'
      parameters:
      - name: sensor_id
        in: path
        required: true
        description: Sensor ID
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingBulkCreate'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /dashboard/summary:
    get:
      tags:
      - dashboard
      summary: Key metrics
      operationId: dashboard_summary
      description: 'Designed for polling every 5 seconds. Allowed roles: admin, user, guest.'
      parameters:
      - name: category
        in: query
        required: false
        description: ''
        schema:
          $ref: '#/components/schemas/SensorCategory'
      - name: from
        in: query
        required: false
        description: ''
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: ''
        schema:
          type: string
          format: date-time
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /dashboard/timeseries:
    get:
      tags:
      - dashboard
      summary: Aggregated readings for charts
      operationId: dashboard_timeseries
      description: 'Allowed roles: admin, user, guest.'
      parameters:
      - name: sensor_id
        in: query
        required: true
        description: ''
        schema:
          type: integer
      - name: from
        in: query
        required: false
        description: ''
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: ''
        schema:
          type: string
          format: date-time
      - name: interval
        in: query
        required: false
        description: ''
        schema:
          type: string
          enum:
          - minute
          - hour
          - day
          default: hour
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSeries'
